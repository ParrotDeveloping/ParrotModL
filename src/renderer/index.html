<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:;"
    />
    <title>ParrotModL</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="bg-layer"></div>

    <div id="titlebar">
      <div class="tb-title">ParrotModL</div>
      <div class="tb-buttons">
        <button id="tb-min" title="Küçült">
          <svg width="11" height="11" viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.2" /></svg>
        </button>
        <button id="tb-max" title="Büyült">
          <svg width="11" height="11" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" stroke="currentColor" stroke-width="1.2" fill="none" /></svg>
        </button>
        <button id="tb-close" class="close" title="Kapat">
          <svg width="11" height="11" viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.2" /></svg>
        </button>
      </div>
    </div>

    <div id="app">
      <aside id="sidebar">
        <div class="brand">
          <img src="assets/logo.png" alt="" />
          <div>
            <div class="name">Parrot<span>ModL</span></div>
            <div class="ver" id="app-version">v1.0.0</div>
          </div>
        </div>

        <nav class="nav" id="nav"></nav>

        <div class="sidebar-spacer"></div>

        <div class="sidebar-label">Hesap</div>
        <button class="account-card" id="account-btn">
          <div class="ph" id="acc-avatar-ph"></div>
          <div class="meta">
            <div class="nm" id="acc-name">Hesap yok</div>
            <div class="ty" id="acc-type">Giriş yapmak için tıkla</div>
          </div>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--text-3); flex: none">
            <path d="M9 18l6-6-6-6" />
          </svg>
        </button>
      </aside>

      <main id="main"><div id="view" class="view"></div></main>
    </div>

    <div id="modal-root"></div>
    <div id="toasts"></div>

    <script src="icons.js"></script>
    <script src="app.js"></script>
    <script src="views/browser.js"></script>
    <script src="views/home.js"></script>
    <script src="views/profile.js"></script>
    <script src="views/discover.js"></script>
    <script src="views/skins.js"></script>
    <script src="views/screenshots.js"></script>
    <script src="views/settings.js"></script>
    <script src="views/accounts.js"></script>
    <script src="boot.js"></script>
  </body>
</html>
